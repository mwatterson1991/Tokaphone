      out.push(h); });
    S.hp=out; return out;
  }
  function body(){ // shoulders as the frame of reference for pose modes
    const P=R.pose; if(!P) return null; const ok=i=>P[i].v>0.5; if(!ok(11)||!ok(12)) return null;
    const Sw=Math.max(20,Math.hypot(P[11].x-P[12].x,P[11].y-P[12].y));
    return {P,ok,Sw,sh:{x:(P[11].x+P[12].x)/2,y:(P[11].y+P[12].y)/2},
      hip:ok(23)&&ok(24)?{x:(P[23].x+P[24].x)/2,y:(P[23].y+P[24].y)/2}:null};
  }

  /* --- DANCE: the body plays the mix. hands are notes, bounce is bass, moving opens everything up --- */
  function dance(dt,now){
    const B=body(); if(!B) return; const {P,ok,Sw,sh,hip}=B;
    if(!S.init){ Object.assign(S,{init:1,bnc:peaker(0.035),nod:peaker(0.04),prevSh:sh.y/Sw,jcd:0,still:0,broke:false,prev:null,slot:-1,wr:{},energy:0,lean:0}); }
    // energy: how much the body is moving, in shoulder widths per second
    if(S.prev){ let e=0,n=0; [0,13,14,15,16,25,26].forEach(i=>{ if(!ok(i)||!S.prev[i]) return; e+=Math.hypot(P[i].x-S.prev[i].x,P[i].y-S.prev[i].y); n++; });
      const inst=n?e/n/Sw/dt:0; S.energy=S.energy*0.85+Math.min(3,inst)*0.15; S.still=inst<0.3?S.still+dt:0; }
    S.prev=P.map(p=>(p.v>0.5?{x:p.x,y:p.y}:null));
    const broke=S.still>1.2;
    if(broke!==S.broke){ S.broke=broke; hud.textContent=broke?'Break':''; drumBus.gain.setTargetAtTime(broke?0.08:1,ctx.currentTime,broke?0.25:0.03); }
    const k=Math.min(1,S.energy/1.2); mfilt.frequency.setTargetAtTime(650*Math.pow(18000/650,k),ctx.currentTime,0.12);
    // bounce: bass. lean picks root, third or fifth
    const lean=hip?(sh.x-hip.x)/Sw:(ok(0)?(P[0].x-sh.x)/Sw:0); S.lean=S.lean*0.7+lean*0.3;
    const b=S.bnc.push(sh.y/Sw);
    if(b&&b.type==='bottom'){ const t=hitTime(), ch=bodyChord(t+epochAtCtx0), iv=S.lean>0.1?7:S.lean<-0.1?ch[1][1]-ch[1][0]:0;
      trig({k:'bz',n:'bass',m:ch[0]-12+iv,v:Math.min(1,0.7+b.amp*0.15)},t); flash(hip?hip.x:sh.x,hip?hip.y:sh.y+Sw,0.8); }
    // nod: clap
    if(ok(0)){ const n=S.nod.push((P[0].y-sh.y)/Sw);
      if(n&&n.type==='bottom'){ trig({k:'bz',n:beat.playing?'clap':'snare',v:Math.min(1,0.55+n.amp*0.15)},hitTime()); flash(P[0].x,P[0].y,1); } }
    // jump: crash and a swell
    const vy=(sh.y/Sw-S.prevSh)/dt; S.prevSh=sh.y/Sw;
    if(vy<-2.6&&now>S.jcd){ S.jcd=now+1200; trig({k:'bz',n:'jump'},hitTime()); flash(sh.x,sh.y,3); }
    // arms wide: more echo and space
    if(ok(15)&&ok(16)){ const w=Math.min(1,Math.max(0,(Math.hypot(P[15].x-P[16].x,P[15].y-P[16].y)/Sw-1.6)/2));
      const V=VIBES[vibe]; fx.dg.gain.setTargetAtTime(V.dl+w*0.45,ctx.currentTime,0.08); fx.rg.gain.setTargetAtTime(V.rv+w*0.35,ctx.currentTime,0.08); }
    // hands up: a note on every 8th while a hand is above the chest. height = pitch, speed = volume
    [15,16].forEach(w=>{ const p=S.wr[w]; if(!ok(w)){S.wr[w]=null;return;}
      const sp=p?Math.hypot(P[w].x-p.x,P[w].y-p.y)/Sw/dt:0; S.wr[w]={x:P[w].x,y:P[w].y,s:(p?p.s*0.6:0)+sp*0.4}; });

      up.forEach(w=>{ const h=Math.min(0.999,Math.max(0,(line-P[w].y)/(2.4*Sw)));
        const kk=Math.floor(h*11), m=BODY_ROOT+Math.floor(kk/5)*12+BODY_PENTA[kk%5]+(w===15?-12:0);
        trig({k:'bz',n:'mel',m,v:Math.min(1,0.5+(S.wr[w]?S.wr[w].s:0)*0.25)},g.tC); flash(P[w].x,P[w].y,0.6); }); }
  }

  /* --- DRUMS: the kit hangs around your body. a strike is the braking of a downswing. a knee lift is the kick --- */
  function drums(dt,now){
    const B=body(); if(!B){S.body=null;return;} const {P,ok,Sw,sh,hip}=B;
    if(!S.init){ Object.assign(S,{init:1,sw:{15:swinger(1.8),16:swinger(1.8)},knee:{25:false,26:false},hitZ:null,cd:{}}); }
    S.body=B;
    [15,16].forEach(w=>{ if(!ok(w)){S.sw[w].p=null;return;}
      const e=S.sw[w].push(P[w].y/Sw,dt);
      if(e&&e.dir>0&&now-(S.cd[w]||0)>80){ S.cd[w]=now;
        const dx=(P[w].x-sh.x)/Sw, dy=(P[w].y-sh.y)/Sw; let best=DZ[3],bd=1e9;
        DZ.forEach(z=>{const d=Math.hypot(dx-z[2],dy-z[3]); if(d<bd){bd=d;best=z;}});
        hit(best,Math.min(1,0.5+e.amp*0.12),P[w]); } });
    if(hip) [25,26].forEach(k=>{ if(!ok(k)){S.knee[k]=false;return;}
      const rel=(P[k].y-hip.y)/Sw, was=S.knee[k], is=was?rel<0.72:rel<0.5;
      if(is&&!was) hit(DZ[6],1,P[k]); S.knee[k]=is; });
  }
  function hit(z,v,at){ const K=KITS[drumKit], n=K[z[0]]?z[0]:(z[0]==='ride'?'crash':z[0]==='tomlo'?'tommid':'snare');
    trig({k:'bz',n,v},hitTime()); S.hitZ={z,t:performance.now()}; flash(at.x,at.y,1); }

  /* --- GUITAR: one hand swings to strum, the other holds up fingers to pick the chord --- */
  function guitar(dt,now){
    const H=trackHands(dt); if(!H.length){S.fret=null;S.strum=null;return;}
    let strum=H[0], fret=H[1]||null;
    if(fret){ const keep=H.find(h=>h.id===S.strumId), other=h=>h===H[0]?H[1]:H[0];
      if(keep&&keep.spd*1.6>other(keep).spd){strum=keep;fret=other(keep);}
      else if(H[1].spd>H[0].spd){strum=H[1];fret=H[0];} }
    S.strumId=strum.id; S.strum=strum; S.fret=fret;
    if(fret){ const n=4-curled(fret).filter(Boolean).length;
      if(n!==S.fcand){S.fcand=n;S.fcandT=now;}
      if(now-S.fcandT>110){ if(n===0) S.mute=true; else { S.mute=false; S.ci=n-1; } } }
    else S.mute=false;
    if(S.ci==null) S.ci=0;

    if(e&&now-(S.lastStrum||0)>90){ S.lastStrum=now;
      const down=e.dir>0, notes=GCH[S.ci][1], ord=down?notes:notes.slice().reverse(), v=Math.min(1,0.35+e.amp*0.12), mute=S.mute;
      ord.forEach((m,i)=>{ if(!down&&i>3) return;
        setTimeout(()=>{ const p2=gtrTone; if(mute) gtrTone='muted'; trig({k:'pluck',m,v:(mute?0.6:0.42)*v}); gtrTone=p2; },i*(down?9:12)); });
      S.strumT=now; flash(strum.c.x,strum.c.y,0.9); }
  }

  /* --- SAX: a raised hand plays. curled fingers walk down the scale. drop below the line to stop --- */
  function sax(dt,now){
    const H=trackHands(dt), vh=vid.videoHeight||720, gate=vh*0.64; S.gate=gate;
    const hs=H.filter(h=>h.c.y<gate).sort((a,b)=>a.c.y-b.c.y).slice(0,2);
    let amp=hs.length?1:0;
    if(hs.length){ let n=0; const keys=[]; hs.forEach(h=>{ curled(h).forEach(x=>{keys.push(x); if(x)n++;}); }); S.keys=keys;
      const m=SAXN[Math.min(SAXN.length-1,n)]+12*airSaxOct;
      if(m!==S.cand){S.cand=m;S.candT=now;}
      S.stable=now-S.candT>70?S.cand:(S.m||m);
      if(saxBreath&&micAn){ micAn.getFloatTimeDomainData(micBufA); let r=0; for(let i=0;i<micBufA.length;i++)r+=micBufA[i]*micBufA[i];
        r=Math.sqrt(r/micBufA.length); amp=Math.min(1,Math.max(0,(r-0.012)*22)); }
    } else S.keys=null;
    S.amp=amp;
    if(amp>0.06){ S.quiet=0;
      if(!S.voice){ S.voice='sx'+Math.random().toString(36).slice(2,7); S.m=S.stable; trig({k:'lon',id:S.voice,m:S.stable,v:'sax'}); }
      else if(S.stable!==S.m){ S.m=S.stable; trig({k:'lset',id:S.voice,m:S.stable}); }
      if(held[S.voice]&&held[S.voice].amp) held[S.voice].amp(0.35+amp*0.65);
    } else if(S.voice){ S.quiet=(S.quiet||0)+dt; if(S.quiet>0.12){ trig({k:'off',id:S.voice}); S.voice=null; } }
  }

  /* --- drawing: lime field, black silhouette, double lines --- */
  function draw(){
    const r=wrap.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
    if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);}
    const W=cv.width,Hh=cv.height, vw=vid.videoWidth||640, vh=vid.videoHeight||480;
    const sc=Math.max(W/vw,Hh/vh), ox=(W-vw*sc)/2, oy=(Hh-vh*sc)/2, mir=camFacing==='user';
    const X=x=>mir?W-(ox+x*sc):ox+x*sc, Y=y=>oy+y*sc;
    c2.fillStyle=LIME; c2.fillRect(0,0,W,Hh);
    if(R.mask){
      if(off.width!==R.mw||off.height!==R.mh){off.width=R.mw;off.height=R.mh;img=oc.createImageData(R.mw,R.mh);}
      const d=img.data, M=R.mask;
      for(let i=0;i<M.length;i++){ let a=(M[i]-0.35)/0.3; a=a<0?0:a>1?1:a; a=a*a*(3-2*a);
        const j=i*4; d[j]=194+(11-194)*a; d[j+1]=240+(11-240)*a; d[j+2]=0+11*a; d[j+3]=255; }
      oc.putImageData(img,0,0);
      c2.save(); c2.imageSmoothingEnabled=true; c2.imageSmoothingQuality='high';
      if(mir){c2.translate(W,0);c2.scale(-1,1);}
      c2.drawImage(off,ox,oy,vw*sc,vh*sc); c2.restore();
    }
    const dbl=(path,w)=>{ c2.lineCap='round'; c2.lineJoin='round';
      c2.strokeStyle=INK; c2.lineWidth=(w+2.5)*dpr; path(); c2.stroke();
      c2.strokeStyle=LIME; c2.lineWidth=w*dpr; path(); c2.stroke(); };
    const label=(txt,x,y,size,on)=>{ c2.font=`600 ${size*dpr}px system-ui,-apple-system,sans-serif`; c2.textAlign='center'; c2.textBaseline='middle';
      if('letterSpacing' in c2) c2.letterSpacing=(size*0.14*dpr)+'px';
      c2.lineWidth=3*dpr; c2.strokeStyle=on?LIME:INK; c2.strokeText(txt,x,y); c2.fillStyle=on?INK:LIME; c2.fillText(txt,x,y); };
    const now=performance.now();
    if(AIR_NEEDS[airMode]==='pose'&&R.pose){ const P=R.pose;
      dbl(()=>{c2.beginPath(); BONES.forEach(([a,b])=>{ if(P[a].v>0.5&&P[b].v>0.5){c2.moveTo(X(P[a].x),Y(P[a].y));c2.lineTo(X(P[b].x),Y(P[b].y));} });

  const ink=()=>getComputedStyle(document.body).getPropertyValue('--ink').trim()||'#141414';
  const red=()=>getComputedStyle(document.body).getPropertyValue('--rec').trim()||'#C0392B';
  function range(){
    const ms=E.items.map(i=>i.note).concat(E.raw.map(p=>p.m)).concat(E.live.map(p=>p.m)).filter(m=>m!=null);
    let lo=ms.length?Math.min(...ms):BODY_ROOT-5, hi=ms.length?Math.max(...ms):BODY_ROOT+7;
    let dl=degOf(lo)-2.5, dh=degOf(hi)+2.5; if(dh-dl<10){const c=(dl+dh)/2; dl=c-5; dh=c+5;}

    const W=cv.width,H=cv.height; c2.clearRect(0,0,W,H);

      c2.globalAlpha=((m-BODY_ROOT)%12+12)%12===0?0.42:0.12; c2.lineWidth=dpr; c2.beginPath(); c2.moveTo(0,y); c2.lineTo(W,y); c2.stroke(); }

    if(E.T){ const ph=((Date.now()/1000-E.T.originE)%L+L)%L; c2.globalAlpha=0.7; c2.lineWidth=dpr; c2.beginPath(); c2.moveTo(X(ph),0); c2.lineTo(X(ph),H); c2.stroke(); }
    if(E.rec){ const t=Date.now()/1000-E.rec.originE; c2.strokeStyle=red(); c2.globalAlpha=1; c2.lineWidth=2*dpr; c2.beginPath(); c2.moveTo(X(t),0); c2.lineTo(X(t),H); c2.stroke(); }

    move(id,p){ if(!E.drag) return; const r=cv.getBoundingClientRect(), k=Math.round((E.drag.y0-p.y*r.height)/E.drag.lane);

  const val=document.createElement('span');val.className='octval';
  const plus=document.createElement('button');plus.className='btn';plus.textContent='+';plus.setAttribute('aria-label','Octave up');
  const upd=()=>{val.textContent=whOct; if(T){T.oct=whOct; refresh();}};
  minus.addEventListener('click',()=>{whOct=Math.max(-3,whOct-1);upd();});
  plus.addEventListener('click',()=>{whOct=Math.min(1,whOct+1);upd();});
  octwrap.append(minus,val,plus); val.textContent=whOct;
  tog('Glide',()=>whGlide,v=>{whGlide=v; if(T) T.glide=v;});
  tog('Grid',()=>whGrid,v=>{whGrid=v; if(T&&T.src0){ T.notes=buildNotes(T.src0,T.window); refresh(); }});
  const keep=document.createElement('button'); keep.className='btn'; keep.textContent='Keep'; keep.setAttribute('aria-label','Keep this take looping and record another');
  octwrap.appendChild(keep);
  loopbtn.style.display='none';

  const wrap=document.createElement('div'); wrap.className='takewrap'; stage.appendChild(wrap);
  let T=null, cap=null, an=null, raf=0, alive=true, recState=null, autoStop=null;
  const ed=takeEditor(wrap,(it,done)=>{ if(T){ it.n.m=it.note-12*T.oct; } });
  const lbuf=new Float32Array(2048);

  function buildNotes(src,win){ // segments -> loop notes (time from loop origin)
    const sd=60/bodyBpm()/4, hopT=src.hop/src.sr, notes=[];
    src.segs.forEach(s=>{ let t=win.offset+s.a*hopT+src.W/src.sr/2, end=win.offset+(s.b+1)*hopT+src.W/src.sr/2;
      if(whGrid){ t=Math.round(t/sd)*sd; end=Math.max(t+sd*0.5,Math.round(end/sd)*sd||t+sd*0.5); }
      const bends=[]; for(let k=s.a;k<=s.b;k+=3){ const f=src.f0[k]; if(f) bends.push([(k-s.a)*hopT,Math.max(-2,Math.min(2,hzMidi(f)-s.note))]); }
      notes.push({t:((t%win.L)+win.L)%win.L,d:Math.max(0.06,end-t),m:s.note,bends}); });
    return notes;
  }
  function refresh(){
    if(!T){ ed.items=[]; ed.raw=[]; return; }
    ed.T=T; ed.items=T.notes.map(n=>({t0:n.t,t1:n.t+n.d,note:n.m+12*T.oct,n}));
    const s=T.src0, hopT=s.hop/s.sr; ed.raw=[];
    for(let k=0;k<s.f0.length;k++){ const f=s.f0[k]; ed.raw.push({t:T.window.offset+k*hopT+s.W/s.sr/2,m:f?hzMidi(f)+12*T.oct:null}); }
  }
  function frame(){
    if(!alive) return; raf=requestAnimationFrame(frame);
    if(recState&&an){ an.getFloatTimeDomainData(lbuf); const f=livePitch(lbuf,ctx.sampleRate,450,4200);
      ed.live.push({t:Date.now()/1000-recState.originE,m:f?hzMidi(f)+12*whOct:null}); }
    ed.draw();
  }
  async function begin(b){
    audio();
    if(!bodyMic){ b.textContent='…'; try{ await getMic(); an=ctx.createAnalyser(); an.fftSize=2048; bodyMic.src.connect(an); b.textContent='Hold to whistle'; }
      catch(e){ b.textContent=blockedMsg(e); } return; }
    if(!an){ an=ctx.createAnalyser(); an.fftSize=2048; bodyMic.src.connect(an); }
    ensureBeat(); litBeatBtn();
    if(T){ T.mute=true; }
    cap=startCapture(); const bar=barLen(); recState={originE:Math.floor(Date.now()/1000/bar)*bar, L:bar*8};
    ed.rec=recState; ed.live=[]; ed.items=[]; ed.raw=[]; ed.T=null;
    b.classList.add('rec'); b.textContent='Whistling';
    autoStop=setTimeout(()=>end(b),15000);
  }
  function end(b){
    clearTimeout(autoStop); if(!cap) return;
    const {x,t0E}=stopCapture(cap); cap=null; recState=null; ed.rec=null; b.classList.remove('rec'); b.textContent='Hold to whistle';
    const sr=ctx.sampleRate, tr=yin(x,sr,430,4400,Math.round(sr*0.005),768);
    tr.segs=segment(tr,12,3);
    ed.live=[];
    if(!tr.segs.length){ if(T) T.mute=false; return; }
    const win=takeWindow(t0E,x.length/sr);
    if(T) dropLayer(T);
    T={kind:'notes',from:'whistle',inst:whInst,oct:whOct,glide:whGlide,originE:win.originE,L:win.L,window:win,src0:tr,notes:[]};
    T.notes=buildNotes(tr,win); addLayer(T); refresh();
  }
  holdBar(wrap,'Hold to whistle',begin,end);
  keep.addEventListener('click',()=>{ if(!T) return; T.kept=true; T=null; ed.T=null; refresh(); pickerLoopUI(); keep.classList.add('lit'); setTimeout(()=>keep.classList.remove('lit'),300); });
  stageStop=()=>{ alive=false; cancelAnimationFrame(raf); clearTimeout(autoStop);
    if(cap){ stopCapture(cap); cap=null; if(T) T.mute=false; } if(T) T.kept=true;
    if(an){try{bodyMic.src.disconnect(an);}catch(_){}} dropMic(); loopbtn.style.display=''; };
  frame();
}

/* ================= VOICE (sing, then retune) ================= */
let vcTune='hard', vcSound='clean';
function buildVoice(){
  bodyBeatBtn();
  sel([['hard','Hard tune'],['natural','Natural']],()=>vcTune,v=>{vcTune=v; rerender();},'Tuning');
  sel([['clean','Clean'],['robot','Robot'],['choir','Choir'],['deep','Deep'],['high','High']],()=>vcSound,v=>{vcSound=v; rerender();},'Sound');
  const keep=document.createElement('button'); keep.className='btn'; keep.textContent='Keep'; keep.setAttribute('aria-label','Keep this take looping and record another');
  octwrap.appendChild(keep);
  loopbtn.style.display='none';

  const wrap=document.createElement('div'); wrap.className='takewrap'; stage.appendChild(wrap);
  let T=null, cap=null, an=null, raf=0, alive=true, recState=null, autoStop=null, renderTok=0;
  const ed=takeEditor(wrap,(it,done)=>{ if(it.s) it.s.user=it.note; if(done) rerender(); });
  const lbuf=new Float32Array(2048), half=new Float32Array(1024);

  function targetHz(A){ // per analysis frame: corrected pitch in Hz
    const n=A.tr.f0.length, out=new Float32Array(n), tg=new Float32Array(n).fill(NaN);
    A.segs.forEach(s=>{ for(let k=s.a;k<=s.b;k++){ const f=A.tr.f0[k]; const m=f?hzMidi(f):s.med;
      tg[k]=vcTune==='hard'?s.user:m+(s.user-s.med); } });
    let prev=NaN; for(let k=0;k<n;k++){ let v=tg[k];
      if(isNaN(v)){ const f=A.tr.f0[k]; v=f?hzMidi(f):NaN; }
      if(!isNaN(v)&&!isNaN(prev)&&vcTune==='hard') v=prev+(v-prev)*0.45; // fast glide between notes
      prev=isNaN(v)?NaN:v; out[k]=isNaN(v)?0:midiHz(v); }
    return out;
  }
  async function rerender(){
    if(!T||!T.A) return; const tok=++renderTok, A=T.A, sr=A.sr;
    const tgt=targetHz(A), q=A.q, hopO=A.tr.hop*q, cen=A.tr.W*q/2;
    const at=arr=>t=>{ const k=Math.round((t-cen)/hopO); return k>=0&&k<arr.length?arr[k]:0; };
    const shift=(arr,fn)=>arr.map(h=>h?midiHz(fn(hzMidi(h))):0);
    let y;
    if(vcSound==='robot'){ const cur=new Float32Array(Math.ceil(A.x.length/hopO)); for(let i=0;i<cur.length;i++) cur[i]=at(tgt)(i*hopO);
      y=await vocodeOffline(A.x,sr,cur); }
    else {
      y=psola(A.x,sr,A.pm,at(tgt));
      if(vcSound==='choir'){ const h1=psola(A.x,sr,A.pm,at(shift(tgt,m=>degShift(m,2)))), h2=psola(A.x,sr,A.pm,at(shift(tgt,m=>degShift(m,4)))),
          lo=psola(A.x,sr,A.pm,at(shift(tgt,m=>m-12))); const d1=Math.round(sr*0.014), d2=Math.round(sr*0.023);
        const z=new Float32Array(y.length); for(let i=0;i<y.length;i++) z[i]=y[i]+0.55*(h1[i-d1]||0)+0.45*(h2[i-d2]||0)+0.35*lo[i]; y=z; }
      else if(vcSound==='deep') y=psola(A.x,sr,A.pm,at(shift(tgt,m=>m-12)));
      else if(vcSound==='high') y=psola(A.x,sr,A.pm,at(shift(tgt,m=>m+12)));
    }
    if(tok!==renderTok||!T) return;
    normalize(y,0.85); startBufLayer(T,y); refresh();
  }
  function refresh(){
    if(!T||!T.A){ ed.items=[]; ed.raw=[]; ed.T=T; return; }
    const A=T.A, hopT=A.tr.hop/A.tr.sr, c=A.tr.W/A.tr.sr/2, o=T.offset;
    ed.T=T; ed.items=A.segs.map(s=>{const it={t0:o+s.a*hopT+c,t1:o+(s.b+1)*hopT+c,note:s.user,s}; return it;});
    ed.raw=[]; for(let k=0;k<A.tr.f0.length;k++){ const f=A.tr.f0[k]; ed.raw.push({t:o+k*hopT+c,m:f?hzMidi(f):null}); }
  }

  function frame(){
    if(!alive) return; raf=requestAnimationFrame(frame);
    if(recState&&an){ an.getFloatTimeDomainData(lbuf); for(let i=0;i<1024;i++) half[i]=(lbuf[2*i]+lbuf[2*i+1])*0.5;
      const f=livePitch(half,ctx.sampleRate/2,70,1000); ed.live.push({t:Date.now()/1000-recState.originE,m:f?hzMidi(f):null}); }
    ed.draw();
  }
  async function begin(b){
    audio();
    if(!bodyMic){ b.textContent='…'; try{ await getMic(); an=ctx.createAnalyser(); an.fftSize=2048; bodyMic.src.connect(an); b.textContent='Headphones on · hold to sing'; }
      catch(e){ b.textContent=blockedMsg(e); } return; }
    if(!an){ an=ctx.createAnalyser(); an.fftSize=2048; bodyMic.src.connect(an); }
    ensureBeat(); litBeatBtn();
    if(T&&T.g) T.g.gain.setTargetAtTime(0,ctx.currentTime,0.02);
    cap=startCapture(); const bar=barLen(); recState={originE:Math.floor(Date.now()/1000/bar)*bar, L:bar*8};
    ed.rec=recState; ed.live=[]; ed.items=[]; ed.raw=[]; ed.T=null;
    b.classList.add('rec'); b.textContent='Singing';
    autoStop=setTimeout(()=>end(b),16000);
  }
  async function end(b){
    clearTimeout(autoStop); if(!cap) return;
    const {x,t0E}=stopCapture(cap); cap=null; recState=null; ed.rec=null; b.classList.remove('rec'); b.textContent='Analyzing…';
    await new Promise(r=>setTimeout(r,20));
    const sr=ctx.sampleRate, dec=decimate(x,sr), tr=yin(dec.y,dec.sr,70,1000,Math.round(dec.sr*0.005),Math.round(dec.sr*0.03));
    const segs=segment(tr,8,4); segs.forEach(s=>s.user=s.note);
    const hopO=tr.hop*dec.q, cen=tr.W*dec.q/2;
    const pm=pitchMarks(x,sr,t=>{const k=Math.round((t-cen)/hopO); return k>=0&&k<tr.f0.length?tr.f0[k]:0;});
    ed.live=[]; b.textContent='Headphones on · hold to sing';
    const win=takeWindow(t0E,x.length/sr);
    if(T) dropLayer(T);
    T={kind:'buf',from:'voice',originE:win.originE,offset:win.offset,L:win.L,A:{x,sr,q:dec.q,tr,segs,pm}};
    addLayer(T); refresh(); await rerender();
  }
  holdBar(wrap,'Headphones on · hold to sing',begin,end);
  keep.addEventListener('click',()=>{ if(!T) return; T.kept=true; T.A=null; T=null; refresh(); pickerLoopUI(); keep.classList.add('lit'); setTimeout(()=>keep.classList.remove('lit'),300); });
  stageStop=()=>{ alive=false; cancelAnimationFrame(raf); clearTimeout(autoStop); renderTok++;
    if(cap){ stopCapture(cap); cap=null; } if(T){ T.kept=true; if(T.g) T.g.gain.setTargetAtTime(1,ctx.currentTime,0.02); T.A=null; }
    if(an){try{bodyMic.src.disconnect(an);}catch(_){}} dropMic(); loopbtn.style.display=''; };
  frame();
}

/* ---------- picker: layers count as loops, clear stops them ---------- */
{ const base=pickerLoopUI;
  pickerLoopUI=function(){ base();
    const n=Object.keys(loops).length+bodyLayers.length, b=document.getElementById('clearloops');
    b.style.display=n?'flex':'none'; document.getElementById('loopcount').textContent=n+(n===1?' loop':' loops');
    ['whistle','voice'].forEach(k=>{ const c=document.querySelector('.card[data-inst="'+k+'"]'); if(c) c.classList.toggle('haslooop',bodyLayers.some(l=>l.from===k)); }); };
  document.getElementById('clearloops').addEventListener('click',()=>{ bodyLayers.slice().forEach(dropLayer); pickerLoopUI(); });
}
